name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to check out
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Private content guard
        run: bun run check:public-content
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Unit and integration tests
        run: bun run test
      - name: Package tests
        run: bun run test:packages
      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Browser journeys
        run: bun run test:e2e
      - name: Manifest override journey
        run: PW_STUDIO_PORT=5291 PW_STUDIO_MANIFEST="$PWD/tests/e2e/fixtures/third-party.manifest.json" bun run test:e2e -- manifest-override
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: .output/test-results
