name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version package.json)" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match package.json"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the editor
        run: bun run build
      - name: Compile the binaries
        run: |
          mkdir -p release
          for target in darwin-arm64:macos-arm64 darwin-x64:macos-x64 linux-x64:linux-x64 windows-x64:windows-x64.exe; do
            bun build --compile --target="bun-${target%%:*}" src/release/main.ts \
              --asset dist --asset src --outfile "release/prompt-studio-${target##*:}"
          done
      - name: Write latest.json
        run: bun src/release/release-assets.ts "$VERSION" release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" release/* --title "Prompt Studio $VERSION" --notes "${notes:-See CHANGELOG.md}"
      - name: Build the npm package
        run: bun run build:npm-package -- --version "$VERSION"
      - name: Smoke-test the npm package under Bun
        run: bun run smoke:npm-package
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Choose the image tags
        # Docker Hub (salirse/prompt-studio) is added only when both DOCKERHUB_* secrets are set, so a release without
        # them still publishes to GHCR.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          {
            echo 'IMAGE_TAGS<<EOF'
            echo "ghcr.io/salir-se/prompt-studio:$VERSION"
            echo "ghcr.io/salir-se/prompt-studio:latest"
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "docker.io/salirse/prompt-studio:$VERSION"
              echo "docker.io/salirse/prompt-studio:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "PUSH_DOCKERHUB=true" >> "$GITHUB_ENV"
          else
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set; publishing to GHCR only."
          fi
      - name: Log in to Docker Hub
        if: env.PUSH_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ env.IMAGE_TAGS }}
      - name: Publish to npm
        # `bun publish` reads the registry token from NPM_CONFIG_TOKEN (the same variable `bun install` uses for
        # private registries). It has no provenance flag, so this release carries no npm provenance attestation.
        # Skipped when the NPM_TOKEN secret is absent.
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: .output/prompt-studio-npm/package
        run: |
          if [ -z "$NPM_CONFIG_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping npm publish."; exit 0; fi
          bun publish --access public
